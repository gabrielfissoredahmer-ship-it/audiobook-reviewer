name: Native iOS Build Check

on:
  push:
    paths:
      - 'native-ios/**'
      - '.github/workflows/native-ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: native-ios
        run: xcodegen generate
      - name: Resolve packages
        working-directory: native-ios
        run: xcodebuild -resolvePackageDependencies -project AudiobookReviewer.xcodeproj
      - name: Build for iOS Simulator
        working-directory: native-ios
        run: |
          xcodebuild \
            -project AudiobookReviewer.xcodeproj \
            -scheme AudiobookReviewer \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
