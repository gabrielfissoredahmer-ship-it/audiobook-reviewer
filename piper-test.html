<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Teste Piper PT-BR</title><style>body{margin:0;background:#0d0f13;color:#f4f4f2;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px}main{max-width:700px;margin:auto}h1{font-size:24px}.card{background:#171a21;border:1px solid #2c333e;border-radius:18px;padding:16px;margin:14px 0}.btn{width:100%;padding:14px;border-radius:14px;border:1px solid #2c333e;background:#ddb965;color:#1a150c;font-weight:800;font-size:16px;margin-top:10px}.btn.secondary{background:#20252e;color:#fff}.btn:disabled{opacity:.45}select{width:100%;background:#10141a;color:#fff;border:1px solid #2c333e;border-radius:12px;padding:12px;font-size:16px}.status{white-space:pre-wrap;color:#ddb965;font-size:13px;line-height:1.5}.muted{color:#9da6b3;font-size:13px}</style></head><body><main><h1>Teste Piper PT-BR</h1><div class="muted">Teste isolado do motor neural local no iPhone.</div><div class="card"><button id="load" class="btn">1. Carregar motor Piper</button><label style="display:block;margin-top:14px">Voz pt-BR</label><select id="voice"><option>Aguardando motor…</option></select><button id="download" class="btn secondary" disabled>2. Baixar voz</button><button id="test" class="btn" disabled>3. Ouvir frase de teste</button></div><div class="card"><div id="status" class="status">Aguardando.</div></div></main><script type="module">const $=id=>document.getElementById(id);let tts=null,ready=false,audio=null;function s(x){$('status').textContent=x}function norm(v){if(Array.isArray(v))return v.map(x=>[x.id||x.key||x.voiceId||x.name,x]);if(v&&typeof v==='object')return Object.entries(v);return[]} $('load').onclick=async()=>{try{$('load').disabled=true;s('Carregando biblioteca Piper…');tts=await import('https://esm.sh/@mintplex-labs/piper-tts-web?bundle');s('Consultando vozes disponíveis…');const all=norm(await tts.voices());const pt=all.filter(([id,o])=>String(id).startsWith('pt_BR')||String(o?.language?.code||o?.language||'').includes('pt_BR'));$('voice').innerHTML='';if(!pt.length)throw new Error('Nenhuma voz pt_BR retornada pela biblioteca.');for(const [id,o] of pt){const op=document.createElement('option');op.value=id;op.textContent=(o?.name?o.name+' — ':'')+id;$('voice').appendChild(op)}$('download').disabled=false;$('load').textContent='✅ Piper carregado';s('Motor carregado. Foram encontradas '+pt.length+' voz(es) pt-BR. Agora toque em “Baixar voz”.')}catch(e){console.error(e);$('load').disabled=false;s('ERRO AO CARREGAR PIPER:\n'+(e.message||e))}};$('voice').onchange=()=>{ready=false;$('test').disabled=true;$('download').disabled=false};$('download').onclick=async()=>{try{const id=$('voice').value;$('download').disabled=true;s('Baixando '+id+'… 0%');await tts.download(id,p=>{const pct=p?.total?Math.round(p.loaded*100/p.total):0;s('Baixando '+id+'… '+pct+'%')});ready=true;$('test').disabled=false;$('download').textContent='✅ Voz pronta';s('Voz armazenada. Agora toque em “Ouvir frase de teste”.')}catch(e){$('download').disabled=false;s('ERRO AO BAIXAR VOZ:\n'+(e.message||e))}};$('test').onclick=async()=>{if(!ready)return;try{$('test').disabled=true;s('Gerando áudio local no iPhone…');const t0=Date.now();const wav=await tts.predict({text:'Durante muito tempo, antes que os mapas aprendessem a separar os povos por linhas, os reinos se observavam em silêncio.',voiceId:$('voice').value},p=>{if(p?.total)s('Preparando modelo… '+Math.round(p.loaded*100/p.total)+'%')});s('Áudio gerado em '+((Date.now()-t0)/1000).toFixed(1)+' s. Reproduzindo…');const url=URL.createObjectURL(wav);audio=new Audio(url);audio.onended=()=>{URL.revokeObjectURL(url);$('test').disabled=false;s('✅ Teste concluído. Se a voz saiu em português, o Piper funciona no seu iPhone.')};audio.onerror=()=>{$('test').disabled=false;s('O áudio foi gerado, mas o Safari não conseguiu reproduzi-lo.')};await audio.play()}catch(e){console.error(e);$('test').disabled=false;s('ERRO NA GERAÇÃO:\n'+(e.message||e))}};</script></body></html>
